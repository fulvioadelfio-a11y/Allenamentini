name: Aggiorna Allenamentini

on:
  schedule:
    - cron: "17 */3 * * *"   # ogni 3 ore
  workflow_dispatch:          # pulsante "Run workflow" per aggiornare subito

permissions:
  contents: write   # pubblica dati.json sul ramo "dati"
  pages: write
  id-token: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

env:
  TZ: Europe/Rome
  GARMIN_TOKENSTORE: ${{ github.workspace }}/../garmin-tokens
  ALLENAMENTINI_OUT: ${{ github.workspace }}/../sito

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install garminconnect

      # Garmin rinnova i token a ogni accesso: l'ultima versione viene conservata
      # (cifrata con il secret GARMINTOKENS) nella cache di GitHub Actions.
      - name: Recupera i token più recenti
        uses: actions/cache/restore@v4
        with:
          path: token.enc
          key: garmin-token-${{ github.run_id }}
          restore-keys: garmin-token-

      - name: Prepara i token
        env:
          GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
        run: |
          if [ -z "$GARMINTOKENS" ]; then echo "::error::Manca il secret GARMINTOKENS"; exit 1; fi
          mkdir -p "$GARMIN_TOKENSTORE" && chmod 700 "$GARMIN_TOKENSTORE"
          if [ -f token.enc ] && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:GARMINTOKENS -in token.enc -out "$GARMIN_TOKENSTORE/garmin_tokens.json" 2>/dev/null; then
            echo "Uso i token rinnovati dall'ultima esecuzione"
          else
            echo "Uso i token del secret GARMINTOKENS"
            printf '%s' "$GARMINTOKENS" > "$GARMIN_TOKENSTORE/garmin_tokens.json"
          fi
          chmod 600 "$GARMIN_TOKENSTORE/garmin_tokens.json"
          rm -f token.enc

      - name: Scarica i dati e crea il sito
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: python garmin_sito.py

      - name: Cifra i token rinnovati
        if: always()
        env:
          GARMINTOKENS: ${{ secrets.GARMINTOKENS }}
        run: |
          if [ -f "$GARMIN_TOKENSTORE/garmin_tokens.json" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:GARMINTOKENS -in "$GARMIN_TOKENSTORE/garmin_tokens.json" -out token.enc
          fi
          rm -rf "$GARMIN_TOKENSTORE"

      - name: Salva i token
        if: always() && hashFiles('token.enc') != ''
        uses: actions/cache/save@v4
        with:
          path: token.enc
          key: garmin-token-${{ github.run_id }}

      # dati.json sul ramo "dati" (un solo commit, sovrascritto ogni volta):
      # così Claude può leggere i dati aggiornati per rispondere alle domande.
      - name: Pubblica dati.json sul ramo dati
        run: |
          cd "$ALLENAMENTINI_OUT"
          git init -q -b dati
          git add dati.json
          git -c user.name="Allenamentini" -c user.email="actions@users.noreply.github.com" commit -q -m "Dati aggiornati $(date '+%d/%m/%Y %H:%M')"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dati
          rm -rf .git

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.ALLENAMENTINI_OUT }}

      - id: deploy
        uses: actions/deploy-pages@v4
